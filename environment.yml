name: insar
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Geospatial
  - rasterio>=1.3
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.5
  - rasterstats>=0.19
  # Scientific
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - joblib>=1.3
  # Data I/O
  - h5py>=3.9
  - pyyaml>=6.0
  - requests>=2.31
  - boto3>=1.34
  - tqdm>=4.65
  # Visualisation
  - plotly>=5.17
  - folium>=0.15
  - matplotlib>=3.7
  - kaleido>=0.2       # plotly static image export
  # Apps
  - streamlit>=1.30
  - fastapi>=0.110
  - uvicorn>=0.29
  # Dev / test
  - pytest>=8.0
  - jupyter
  - pip
  - pip:
    - earthaccess>=0.9.0       # NASA Earthdata auth + search
    - pystac-client>=0.7.0     # STAC API (Sentinel-2/1 via Element84)
    - shap>=0.45               # optional: SHAP explainability (12_shap_archetypes.py)
